cache:
  cleanUpIntervalSecond: 30
  entryTtlSecond: 10
ingressClasses:
- "private"
- "inter-dc"
- "inter-venture"
- "public"
- "test"
webhook:
  port: 8443
  # TLS files should be mounted as secrets in production
  # For local development, generate self-signed certs:
  #   openssl req -x509 -newkey rsa:4096 -nodes -keyout tls.key -out tls.crt -days 365 -subj "/CN=localhost"
  tlsCertFile: "/etc/webhook/certs/tls.crt"
  tlsKeyFile: "/etc/webhook/certs/tls.key"
